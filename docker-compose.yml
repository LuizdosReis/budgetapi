services:
  db:
    container_name: budget-db
    image: postgres:17.2-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budget
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - budget-network
    deploy:
      resources:
        limits:
          memory: "1024m"
          cpus: "2.0"
  api:
    container_name: budget-api
    build: .
    environment:
      DB_HOST: budget-db
      DB_USER: postgres
      DB_PASSWORD: postgres
      OTEL_LOGS_EXPORTER: console
      OTEL_METRICS_EXPORTER: console
      OTEL_TRACES_EXPORTER: console
      OTEL_JAVAAGENT_ENABLED: true
      OTEL_JAVAAGENT_DEBUG: false
      OTEL_RESOURCE_ATTRIBUTES: service.name=budget-api,service.namespace=budget-group,deployment.environment=local
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
      JAVA_OPTS: -Xms512m -Xmx1024m
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: "2048m"
          cpus: "2.0"
    networks:
      - budget-network
    depends_on:
      - db

networks:
  budget-network:
    external: true