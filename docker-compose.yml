services:
  db:
    container_name: budget-db
    image: postgres:17.2-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budget
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - budget-network
    deploy:
      resources:
        limits:
          memory: "1024m"
          cpus: "2.0"
  api:
    container_name: budget-api
    build: .
    environment:
      DB_HOST: budget-db
      DB_USER: postgres
      DB_PASSWORD: postgres
      OTEL_LOGS_EXPORTER: console
      OTEL_METRICS_EXPORTER: console
      OTEL_TRACES_EXPORTER: console
      OTEL_JAVAAGENT_ENABLED: true
      OTEL_JAVAAGENT_DEBUG: false
      OTEL_RESOURCE_ATTRIBUTES: service.namespace=cogent-animal,deployment.environment=local,service.instance.id=local,telemetry.sdk.language=java
      OTEL_SERVICE_NAME: budgetapi
      OTEL_EXPERIMENTAL_EXPORTER_OTLP_RETRY_ENABLED: true
      OTEL_EXPORTER_OTLP_METRICS_DEFAULT_HISTOGRAM_AGGREGATION: BASE2_EXPONENTIAL_BUCKET_HISTOGRAM
      OTEL_EXPERIMENTAL_RESOURCE_DISABLED_KEYS: process.command_args
      OTEL_EXPORTER_OTLP_ENDPOINT: https://otlp.eu01.nr-data.net
      OTEL_EXPORTER_OTLP_HEADERS: api-key=${NEW_RELIC_API_KEY}
      OTEL_ATTRIBUTE_VALUE_LENGTH_LIMIT: 512
      OTEL_BSP_MAX_EXPORT_BATCH_SIZE: 128
      OTEL_EXPORTER_OTLP_COMPRESSION: gzip
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_METRICS_TEMPORALITY_PREFERENCE: delta
      JAVA_TOOL_OPTIONS: -Xms64m -Xmx128m -XX:+UseSerialGC -XX:MinHeapFreeRatio=20 -XX:MaxHeapFreeRatio=40 -XX:MaxMetaspaceSize=160m -XX:+MetaspaceReclaimPolicy=aggressive
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: "2048m"
          cpus: "2.0"
    networks:
      - budget-network
    depends_on:
      - db

networks:
  budget-network:
    external: true