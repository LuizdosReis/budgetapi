services:
  db:
    container_name: budget-db
    image: postgres:17.2-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: budget
    ports:
      - "5432:5432"
    volumes:
      - ./data:/var/lib/postgresql/data
    networks:
      - budget-network
    deploy:
      resources:
        limits:
          memory: "1024m"
          cpus: "2.0"
  api:
    container_name: budget-api
    build: .
    environment:
      DB_HOST: budget-db
      DB_USER: postgres
      DB_PASSWORD: postgres
      OTEL_JAVAAGENT_ENABLED: false
      OTEL_RESOURCE_ATTRIBUTES: service.name=my-app,service.namespace=my-application-group,deployment.environment=production
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_EXPORTER_OTLP_ENDPOINT: http://collector:4318
    ports:
      - "8080:8080"
    deploy:
      resources:
        limits:
          memory: "1024m"
          cpus: "2.0"
    networks:
      - budget-network

networks:
  budget-network:
    external: true